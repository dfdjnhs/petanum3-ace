<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PETA #2.3 (PLATINUM ACEWE)</title>
</head>
<style>

  @font-face {
    font-family: 'cortis';
    src: url('/NeueHaasGrotDisp-95Black-Trial.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
  }
  body {
    margin: 0px;
    background: rgba(125, 255, 160, 1);
    animation: fadeIn 1s ease;
    
  }
  
  .banner {
    overflow: hidden;
    display: block;
    mask-image: linear-gradient(to bottom, rgba(255, 255, 255, 1) 45% , rgba(255, 255, 255, 0) 95%);
    z-index: -99;
    height: 400px;
  }
  
  .banner img {
    object-fit: cover;
    width: 100%;
    height: 100%;
    animation: animate 10s ease;
    animation-iteration-count: infinite;
    transform: scale(1);
  }
  
  .logo {
    font-family: 'cortis', Arial, sans-serif;
    text-align: center;
    font-size: 4.5em;
    transform: translateY(-100px);
    text-shadow: 0px 2px 50px;
  }
  
  .form {
    transform: translateY(-50px);
    margin: 25px;
    align-content: center;
    font-family: 'cortis', Arial, sans-serif;
  }
  
  input, select {
    padding: 11px 15px;
    font-family: 'cortis', Arial, sans-serif;
  }
  
  label {
    text-align: left;
  }
  
  .info {
    margin-bottom: 10px;
    transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  
    .info:hover {
    transform: scale(1.03);
  }
  
  .gender-option {
   display: flex;
   align-items: center;
   margin-bottom: 10px;
   cursor: pointer;
   padding: 10px 10px;
   background: rgba(0, 0, 0, 0.39);
   transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
 }
   .gender-option:hover {
    transform: scale(1.05);
  }
 
 .gender-option:last-child {
   margin-bottom: 0;
 }
 
 .gender-option input[type="radio"] {
   width: 18px;
   height: 18px;
   margin-right: 10px;
   accent-color: rgba(95, 188, 120, 1);
   cursor: pointer;
 }
 
 .gender-option label {
   margin-bottom: 0;
   font-weight: normal;
   text-transform: none;
   color: #FFFFFF;
   cursor: pointer;
 }
 
 .page-background {
   background: url('/517a86be65e2c862e73e1ecd18a85627.gif');
   position: fixed;
   width: 100%;
   height: 100%;
   opacity: 30%;
 }
  
  @keyframes animate {
    0% {
      transform: scale(1);
    }
    
    50% {
      transform: scale(1.10);
    }
    
    100% {
      transform: scale(1);
    }
  }
  
  @keyframes fadeIn {
    from {
      transform: translateY(10px);
      opacity: 0%;
    }
    to {
      transform: translateY(0px);
      opacity: 100%;
    }
  }
</style>
<body>
  <div class="page-background">
  </div>

  <div class="banner">
    <img src="/redred.jpg">
  </div>
  <div class="logo">CORTIS</div>

  
  <div class="form">
      <h2 style="font-family: 'cortis', Arial, sans-serif; text-align: center;">
    STUDENT REGISTRATION FORM
  </h2>
  <div class="info">
  <label>Name</label>
  <input type="textarea" placeholder="e.g, Juan Dela Cruz" style="width: 89%;">
  </div>
  <div class="info">
  <label>Learner's Reference Number (LRN)</label>
  <input type="textarea" placeholder="XXXXXXXXXXXX (12 digits long)" style="width: 89%;">
  </div>
    <div class="info">
  <label>Grade Level</label>
<select name="select" id="cars" style="width: 100%";>
  <option value="volvo">Grade 7</option>
  <option value="saab">Grade 8</option>
  <option value="mercedes" selected>Grade 9</option>
  <option value="audi">Grade 10</option>
  <option value="audi">Grade 11 - STEM</option>
  <option value="audi">Grade 11 - ABM</option>
  <option value="audi">Grade 12 - STEM</option>
  <option value="audi">Grade 12 - ABM</option>
</select>

  </div>
    <div class="info">
    <label>Email Address</label>
    <input type="textarea" placeholder="yourname@gmail.com" style="width: 89%;">
  </div>
  <div class="info">
      <label>Birthdate</label>
      <input type="date" placeholder="yourname@gmail.com" style="width: 89%;">
    </div>
   <div class="info">
   <div class="gender-box">
     <p>Please select your gender:</p>
     
     <div class="gender-option">
       <input type="radio" id="female" name="gender" value="female">
       <label for="female">Female</label>
     </div>
     
     <div class="gender-option">
       <input type="radio" id="male" name="gender" value="male">
       <label for="male">Male</label>
     </div>
     
     <div class="gender-option">
       <input type="radio" id="non-binary" name="gender" value="non-binary">
       <label for="non-binary">Non-binary</label>
     </div>
     
     <div class="gender-option">
       <input type="radio" id="prefer-not-say" name="gender" value="prefer-not-say">
       <label for="prefer-not-say">Prefer not to say</label>
     </div>
   </div>
 </div>
  </div>
  
</body>

</html>
